AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Mission Control - Personal dashboard

Globals:
  Function:
    Runtime: nodejs20.x
    Timeout: 60
    MemorySize: 256

Parameters:
  Stage:
    Type: String
    Default: prod

Resources:
  # ── API ──────────────────────────────────────────────
  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowMethods:
          - GET
          - OPTIONS
        AllowHeaders:
          - Content-Type

  # ── Players Lambda ──────────────────────────────────
  PlayersFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/players/
      Handler: index.handler
      Timeout: 120
      Architectures:
        - arm64
      Environment:
        Variables:
          PLAYERS_TABLE: !Ref PlayersTable
          GCP_SECRET_ARN: !Ref GcpCredentials
      Events:
        GetPlayers:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/players
            Method: GET
        DailyPreload:
          Type: Schedule
          Properties:
            Schedule: cron(5 6 * * ? *)
            Description: Daily players cache preload at 6:05am UTC
            Enabled: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PlayersTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref GcpCredentials

  # ── DynamoDB (players cache) ────────────────────────
  PlayersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── GCP Service Account Credentials ─────────────────
  GcpCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: mission-control/gcp-service-account
      Description: GCP service account credentials for Google Sheets API
      SecretString: '{}'

  # ── Spending Lambda ─────────────────────────────────
  SpendingFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/spending/
      Handler: index.handler
      Timeout: 30
      Architectures:
        - arm64
      Environment:
        Variables:
          SPENDING_TABLE: !Ref SpendingTable
          SPENDING_SECRET_ARN: !Ref SpendingCredentials
          BASE_URL: !Sub https://${CloudFrontDistribution.DomainName}
      Events:
        SpendingStatus:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/spending/status
            Method: GET
        SpendingAuthMonzo:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/spending/auth/monzo
            Method: GET
        SpendingAuthMonzoCallback:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/spending/auth/monzo/callback
            Method: GET
        SpendingAccounts:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/spending/accounts
            Method: GET
        SpendingTransactions:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/spending/transactions
            Method: GET
        SpendingDisconnect:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/spending/disconnect
            Method: DELETE
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref SpendingTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref SpendingCredentials

  # ── DynamoDB (spending tokens + cache) ──────────────
  SpendingTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Spending Credentials (Monzo + Enable Banking) ───
  SpendingCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: mission-control/spending
      Description: OAuth credentials for Monzo and Enable Banking
      SecretString: '{"monzo":{"clientId":"","clientSecret":""},"enableBanking":{"appId":"","appSecret":""}}'

  # ── Messages Lambda ─────────────────────────────────
  MessagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/messages/
      Handler: index.handler
      Timeout: 30
      Architectures:
        - arm64
      Events:
        GetMessages:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/messages
            Method: GET
        PostMessages:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/messages
            Method: POST
        DeleteMessages:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/messages
            Method: DELETE
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:PutObjectAcl
                - s3:DeleteObject
              Resource: arn:aws:s3:::assets.waffle.game/dailymessage/*
            - Effect: Allow
              Action:
                - s3:ListBucket
              Resource: arn:aws:s3:::assets.waffle.game
              Condition:
                StringLike:
                  s3:prefix: dailymessage/*

  # ── Revenue Lambda ──────────────────────────────────
  RevenueFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: backend/revenue/
      Handler: index.handler
      Timeout: 120
      Architectures:
        - arm64
      Environment:
        Variables:
          PROSPER_SECRET_ARN: !Ref ProsperCredentials
          REVENUE_TABLE: !Ref RevenueTable
      Events:
        GetRevenue:
          Type: HttpApi
          Properties:
            ApiId: !Ref Api
            Path: /api/revenue
            Method: GET
        DailyPreload:
          Type: Schedule
          Properties:
            Schedule: cron(0 6 * * ? *)
            Description: Daily cache preload at 6am UTC (7am BST)
            Enabled: true
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref RevenueTable
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
              Resource: !Ref ProsperCredentials

  # ── DynamoDB (revenue cache) ────────────────────────
  RevenueTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: true

  # ── Secrets Manager ─────────────────────────────────
  ProsperCredentials:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: mission-control/prosper
      Description: Prosper/Venatus API credentials
      SecretString: '{"email":"","password":"","otpSecret":""}'

  # ── S3 Frontend Bucket ──────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub mission-control-frontend-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${FrontendBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}

  # ── CloudFront ──────────────────────────────────────
  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref OAC
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: ApiOrigin
            DomainName: !Sub ${Api}.execute-api.${AWS::Region}.amazonaws.com
            OriginPath: !Sub /${Stage}
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac  # AllViewerExceptHostHeader
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
        PriceClass: PriceClass_100

  OAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: mission-control-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

Outputs:
  ApiUrl:
    Value: !Sub https://${Api}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  CloudFrontUrl:
    Value: !Sub https://${CloudFrontDistribution.DomainName}
  FrontendBucket:
    Value: !Ref FrontendBucket
  MessagesFunctionRoleArn:
    Description: IAM Role ARN for the Messages Lambda (add to assets.waffle.game bucket policy)
    Value: !GetAtt MessagesFunctionRole.Arn
